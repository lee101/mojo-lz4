[project]
name = "mojo-lz4"
version = "0.1.0"
description = "LZ4 block and frame compression kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "lz4", "compression"]

[project.optional-dependencies]
dev = ["pytest", "lz4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
